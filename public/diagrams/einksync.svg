oke="none" stroke-width="1.2" opacity="1"/><text font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#2f3640"><tspan x="780.0" y="195.0">the quick brown fox jumps</tspan></text><text font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="normal" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#2f3640"><tspan x="910" y="104.0">## Page 5</tspan></text><text font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="normal" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#2f3640"><tspan x="910" y="130.0">&gt; the quick brown fox</tspan></text><text font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="normal" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#2f3640"><tspan x="910" y="156.0">&gt; jumps over the lazy</tspan></text><text font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="normal" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#4d638c"><tspan x="910" y="182.0">[[paper.pdf#page=5]]</tspan></text><text font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#2f3640"><tspan x="120" y="258.0">You highlight</tspan></text><text font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#7b8594"><tspan x="120" y="284.6">on a reMarkable tablet,</tspan><tspan x="120" y="299.6">no vendor cloud</tspan></text><text font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#2f3640"><tspan x="340" y="258.0">Sync what changed</tspan></text><text font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#7b8594"><tspan x="340" y="284.6">over your Wi-Fi, one file at</tspan><tspan x="340" y="299.6">a time on a 512 MB device</tspan></text><text font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#2f3640"><tspan x="560" y="258.0">Decode the strokes</tspan></text><text font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#7b8594"><tspan x="560" y="284.6">hand-written parser for</tspan><tspan x="560" y="299.6">the old binary formats</tspan></text><text font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#2f3640"><tspan x="780" y="258.0">Recover the text</tspan></text><text font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#7b8594"><tspan x="780" y="284.6">matched to the PDF, then</tspan><tspan x="780" y="299.6">fragments merged</tspan></text><text font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#2f3640"><tspan x="990" y="258.0">A note in Obsidian</tspan></text><text font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#7b8594"><tspan x="990" y="284.6">your own writing around</tspan><tspan x="990" y="299.6">it is preserved</tspan></text><text font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#7b8594"><tspan x="550" y="365.0">Open source  ·  350+ downloads  ·  700+ tests</tspan></text></svg>